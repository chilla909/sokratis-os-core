[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sokratis-os-public-core"
version = "0.1.0"
description = "A provider-neutral governance kernel for human-led AI systems"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Sokratis-OS contributors"}
]
keywords = [
  "ai",
  "ai-agents",
  "ai-governance",
  "human-in-the-loop",
  "workflow",
  "open-source"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries"
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[project.urls]
Homepage = "https://github.com/chilla909/sokratis-os-core"
Repository = "https://github.com/chilla909/sokratis-os-core"
Issues = "https://github.com/chilla909/sokratis-os-core/issues"

[tool.setuptools.packages.find]
include = ["public_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
